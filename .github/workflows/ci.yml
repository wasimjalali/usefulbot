name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm scripts call /usr/local/bin/node, which on the runner is an older preinstalled Node.
      - name: Point /usr/local/bin/node at the .nvmrc Node
        run: sudo ln -sf "$(which node)" /usr/local/bin/node && /usr/local/bin/node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
